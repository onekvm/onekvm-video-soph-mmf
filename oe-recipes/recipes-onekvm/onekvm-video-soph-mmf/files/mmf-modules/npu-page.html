<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NPU</title>
  <style>
    :root { color-scheme: dark; --ink: #edf4f8; --sub: #afbdc8; --dim: #778792; --line: #dce8f21c; --chassis: #10171d; --inset: #0c1319; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); font: 14px/1.45 ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; }
    .shell { max-width: 720px; padding: 8px 0 24px; }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.03em; }
    .backends { margin: 0 0 16px; color: var(--sub); font-size: 13px; }
    .status { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .row { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; padding: 12px 16px; background: var(--chassis); }
    .row span { color: var(--dim); }
    .row strong { font-weight: 700; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="shell">
    <h1 data-t="title">NPU</h1>
    <p id="backends" class="backends">—</p>
    <section class="status">
      <div class="row"><span data-t="runtime">OCR runtime</span><strong id="runtime">—</strong></div>
      <div class="row"><span data-t="module">Kernel module</span><strong id="module">—</strong></div>
      <div class="row"><span data-t="device">Device</span><strong id="device">—</strong></div>
      <div class="row"><span data-t="available">Device present</span><strong id="available">—</strong></div>
    </section>
  </main>
  <script src="./npu.js" defer></script>
</body>
</html>
