# Keep VI errors, warnings, and notices while suppressing periodic profiling
# and debug output such as _vi_event_handler_thread frame-duration reports.
options soph_vi vi_log_lv=7

# OneKVM reserves encoder channel 0 for JPEG and channels 1-3 for H.26x.
# It has no decoder path. Avoid creating 12 unused encoder and 64 unused
# decoder character devices (and the corresponding udev work) at boot.
options soph_vc_driver MaxVencChnNum=4 MaxVdecChnNum=0
